---
- name: playbook
  hosts: localhost
  tasks:
    - name: install deps
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: docker gpg
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: add docker repo
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: docker install
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: add user to group docker
      user:
        name: "{{ lookup('env', 'USER') }}"
        groups: docker
        append: yes

    - name: start docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: docker check
      command: docker --version
      changed_when: false

    - name: copy script
      copy:
        src: "../Script/main.py"
        dest: /app/main.py

    - name: docker image build
      docker_image:
        name: "app-image"
        build:
          path: "{{ lookup('env', 'PWD') }}"
          dockerfile: "{{ lookup('env', 'PWD') }}/Docker/Dockerfile"
        source: build

    - name: docker run image
      docker_container:
        name: "app"
        image: "app-image"
        state: started
        detach: false
      register: container_result
      ignore_errors: yes

    - name: verify execution
      assert:
        that:
          - not container_result.failed
        fail_msg: "Container execution failed"

    - name: docker logs
      command: docker logs app
      register: container_logs
      changed_when: false

    - name: log print
      debug:
        msg: "{{ container_logs.stdout }}"